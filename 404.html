<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Page not found — return to the Stackly luxury watch collection.">
  <title>404 — Page Not Found | Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="cursor-dot" aria-hidden="true"></div><div class="cursor-outline" aria-hidden="true"></div>

<!-- Background Video -->
<video autoplay muted loop playsinline style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; width: auto; height: auto; z-index: -2; object-fit: cover; transform: scale(1.2); transform-origin: center;">
  <source src="assets/videos/watch1.mp4" type="video/mp4">
</video>
<!-- Dark Overlay for Readability -->
<div style="position: fixed; inset: 0; background: rgba(8, 8, 14, 0.75); z-index: -1;"></div>

<main class="not-found-wrapper" id="main-content">
  <div class="not-found-num" aria-hidden="true">404</div>
  <h1 class="not-found-title">Time stood still here</h1>
  <p class="not-found-text">The page you are looking for has been moved, deleted, or perhaps never existed. Let us guide you back to where time moves.</p>
  <div style="display:flex;flex-wrap:wrap;gap:1rem;justify-content:center; position:relative; z-index:10;">
    <a href="index.html" class="btn-primary"><i class="fa-solid fa-house" style="margin-right:0.5rem"></i> Go to Home</a>
    <button onclick="handleGoBack()" style="display:inline-flex;align-items:center;border:1px solid #eab308;background:#eab308;padding:0.8rem 2rem;color:#111;text-decoration:none;font-weight:600;font-size:0.9rem;cursor:pointer;font-family:inherit;transition:opacity 0.3s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'"><i class="fa-solid fa-arrow-left" style="margin-right:0.5rem"></i> Go Back</button>
  </div>
</main>

<script>
function handleGoBack() {
  const loader = document.createElement('div');
  loader.innerHTML = '<div style="display: flex; flex-direction: column; align-items: center; gap: 30px;"><img src="assets/images/logo.webp" alt="Stackly Logo" style="height: 50px;"><div style="width: 180px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;"><div style="width: 100%; height: 100%; background: var(--clr-gold, #c3b091); animation: loadingBarProgress 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; transform-origin: left; transform: scaleX(0);"></div></div></div><style>@keyframes loadingBarProgress { 0% { transform: scaleX(0); } 50% { transform: scaleX(0.7); } 100% { transform: scaleX(1); } }</style>';
  loader.style.cssText = 'position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0c10; z-index: 999999; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;';
  document.body.appendChild(loader);
  
  requestAnimationFrame(() => {
    loader.style.opacity = '1';
  });
  
  setTimeout(() => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'index.html';
    }
  }, 1500);
}
</script>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
