<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Page not found — return to the Stackly luxury watch collection.">
  <title>404 — Page Not Found | Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="cursor-dot" aria-hidden="true"></div><div class="cursor-outline" aria-hidden="true"></div>

<main class="not-found-wrapper" id="main-content">
  <div class="not-found-num" aria-hidden="true">404</div>
  <h1 class="not-found-title">Time stood still here</h1>
  <p class="not-found-text">The page you are looking for has been moved, deleted, or perhaps never existed. Let us guide you back to where time moves.</p>
  <div style="display:flex;flex-wrap:wrap;gap:1rem;justify-content:center; position:relative; z-index:10;">
    <a href="index.html" class="btn-primary"><i class="fa-solid fa-house" style="margin-right:0.5rem"></i> Go to Home</a>
    <button onclick="history.back()" style="display:inline-flex;align-items:center;border:1px solid #eab308;background:#eab308;padding:0.8rem 2rem;color:#111;text-decoration:none;font-weight:600;font-size:0.9rem;cursor:pointer;font-family:inherit;transition:opacity 0.3s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'"><i class="fa-solid fa-arrow-left" style="margin-right:0.5rem"></i> Go Back</button>
  </div>
  <div style="margin-top:4rem;opacity:0.3">
    <img src="assets/images/luxury-watch-macro.webp" alt="Stackly skeleton watch movement" loading="lazy" width="200" height="200" style="width:120px;height:120px;object-fit:cover;border-radius:50%;margin:0 auto;filter:grayscale(1)">
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
