<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Create a Stackly account for exclusive collector benefits, early access to limited editions, and personalised service.">
  <title>Sign Up — Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .mobile-back-btn { display: none; position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 10; color: var(--clr-gold); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    @media (max-width: 991px) {
      .mobile-back-btn { display: flex; }
      .auth-image-side .btn-text { display: none; }
    }
  </style>
</head>
<body>
<div class="cursor-dot" aria-hidden="true"></div><div class="cursor-outline" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<main class="auth-wrapper" id="main-content">
  <div class="auth-image-side" style="position: relative; background-image: url('assets/images/blog-post-6.webp'); background-size: cover; background-position: center;">
    <a href="index.html" class="btn-text" style="position: absolute; top: clamp(1.5rem, 4vw, 3rem); left: clamp(1.5rem, 4vw, 3rem); z-index: 10; color: var(--clr-gold); text-shadow: 0 2px 4px rgba(0,0,0,0.5);"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
  </div>
  <div class="auth-form-side" style="position: relative;">
    <a href="index.html" class="btn-text mobile-back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
  <div class="auth-card">
    <div class="auth-logo"><img src="assets/images/logo.webp" alt="Stackly Logo"></div>
    <h1 class="auth-title">Join the Stackly</h1>
    <p class="auth-subtitle">Create your collector account</p>

    <form id="signup-form" aria-label="Sign up form" novalidate>
      <div class="form-group">
        <label for="signup-role" class="form-label">Role</label>
        <select id="signup-role" class="form-control" required style="cursor: pointer;">
          <option value="client" style="background: var(--clr-bg); color: var(--clr-white);">Client</option>
          <option value="admin" style="background: var(--clr-bg); color: var(--clr-white);">Admin</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="signup-first" class="form-label">First Name</label>
          <input type="text" id="signup-first" class="form-control" placeholder="Henri" required autocomplete="given-name">
        </div>
        <div class="form-group">
          <label for="signup-last" class="form-label">Last Name</label>
          <input type="text" id="signup-last" class="form-control" placeholder="Marchetti" required autocomplete="family-name">
        </div>
      </div>
      <div class="form-group">
        <label for="signup-email" class="form-label">Email</label>
        <input type="email" id="signup-email" class="form-control" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="signup-password" class="form-label">Password</label>
        <input type="password" id="signup-password" class="form-control" placeholder="Min 8 characters" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="signup-confirm" class="form-label">Confirm Password</label>
        <input type="password" id="signup-confirm" class="form-control" placeholder="Repeat password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary w-full" id="signup-submit" style="margin-top:0.5rem">
        Create Account <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <p class="auth-footer-text">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js" defer></script>
<script src="assets/js/main.js" defer></script>
<script>
document.getElementById("signup-form")?.addEventListener("submit", function(e) {
  e.preventDefault();
  const firstName = document.getElementById("signup-first")?.value || "";
  const lastName = document.getElementById("signup-last")?.value || "";
  const email = document.getElementById("signup-email")?.value || "";
  const p = document.getElementById("signup-password")?.value;
  const c = document.getElementById("signup-confirm")?.value;
  
  if (p !== c) { showToast("Passwords do not match."); return; }
  
  let users = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
  users[email] = { firstName: firstName, lastName: lastName };
  localStorage.setItem('registeredUsers', JSON.stringify(users));
  
  showToast("Welcome to the Stackly family!");
  setTimeout(() => {
    window.location.href = 'login.html';
  }, 1000);
});
</script>
</body>
</html>
