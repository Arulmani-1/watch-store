<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Create a Stackly account for exclusive collector benefits, early access to limited editions, and personalised service.">
  <title>Sign Up — Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="cursor-dot" aria-hidden="true"></div><div class="cursor-outline" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<nav id="navbar" role="navigation" aria-label="Main navigation">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">STACK<span>LY</span></a>
    <ul class="nav-links" role="list">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="services.html">Service</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <a href="login.html" class="nav-login" id="nav-login-btn">Login</a>
      <a href="signup.html" class="nav-signup" id="nav-signup-btn">Sign Up</a>
      <button id="hamburger-btn" class="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
    </div>
  </div>
</nav>
<div id="mobile-nav" role="dialog" aria-modal="true" aria-label="Mobile navigation">
  <nav class="mobile-nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="services.html">Service</a>
    <a href="blog.html">Blog</a>
    <a href="shop.html">Shop</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
  </nav>
</div>

<main class="auth-wrapper" id="main-content">
  <div class="auth-card">
    <div class="auth-logo">STACKLY</div>
    <h1 class="auth-title">Join the Maison</h1>
    <p class="auth-subtitle">Create your collector account</p>

    <form id="signup-form" aria-label="Sign up form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="signup-first" class="form-label">First Name</label>
          <input type="text" id="signup-first" class="form-control" placeholder="Henri" required autocomplete="given-name">
        </div>
        <div class="form-group">
          <label for="signup-last" class="form-label">Last Name</label>
          <input type="text" id="signup-last" class="form-control" placeholder="Marchetti" required autocomplete="family-name">
        </div>
      </div>
      <div class="form-group">
        <label for="signup-email" class="form-label">Email</label>
        <input type="email" id="signup-email" class="form-control" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="signup-password" class="form-label">Password</label>
        <input type="password" id="signup-password" class="form-control" placeholder="Min 8 characters" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="signup-confirm" class="form-label">Confirm Password</label>
        <input type="password" id="signup-confirm" class="form-control" placeholder="Repeat password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary w-full" id="signup-submit" style="margin-top:0.5rem">
        Create Account <i class="fa-regular fa-arrow-right"></i>
      </button>
    </form>

    <p class="auth-footer-text">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js" defer></script>
<script src="assets/js/main.js" defer></script>
<script>
document.getElementById("signup-form")?.addEventListener("submit", function(e) {
  e.preventDefault();
  const p = document.getElementById("signup-password")?.value;
  const c = document.getElementById("signup-confirm")?.value;
  if (p !== c) { showToast("Passwords do not match."); return; }
  showToast("Welcome to the Stackly family!");
});
</script>
</body>
</html>
