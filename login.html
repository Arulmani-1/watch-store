<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Sign in to your Stackly account to manage orders, wishlist, and exclusive member benefits.">
  <title>Login — Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="cursor-dot" aria-hidden="true"></div><div class="cursor-outline" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<main class="auth-wrapper" id="main-content">
  <div class="auth-image-side" style="position: relative;">
    <a href="index.html" class="btn-text" style="position: absolute; top: clamp(1.5rem, 4vw, 3rem); left: clamp(1.5rem, 4vw, 3rem); z-index: 10; color: var(--clr-gold); text-shadow: 0 2px 4px rgba(0,0,0,0.5);"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
  </div>
  <div class="auth-form-side" style="position: relative;">
  <div class="auth-card" data-aos="scale-in">
    <div class="auth-logo"><img src="assets/images/logo.webp" alt="Stackly Logo"></div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your collector account</p>

    <form id="login-form" aria-label="Login form" novalidate>
      <div class="form-group">
        <label for="login-role" class="form-label">Role</label>
        <select id="login-role" class="form-control" required style="cursor: pointer;">
          <option value="client" style="background: var(--clr-bg); color: var(--clr-white);">Client</option>
          <option value="admin" style="background: var(--clr-bg); color: var(--clr-white);">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label for="login-email" class="form-label">Email</label>
        <input type="email" id="login-email" class="form-control" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password" class="form-label">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:1.5rem">
        <a href="#" style="font-size:0.8rem;color:var(--clr-gold)">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary w-full" id="login-submit">
        Sign In <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <button class="btn-ghost w-full" id="google-login" style="justify-content:center;gap:0.75rem">
      <i class="fa-brands fa-google"></i> Continue with Google
    </button>

    <p class="auth-footer-text">
      New to Stackly? <a href="signup.html">Create an account</a>
    </p>
  </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js" defer></script>
<script src="assets/js/main.js" defer></script>
<script>
document.getElementById("login-form")?.addEventListener("submit", function(e) {
  e.preventDefault();
  showToast("Welcome back to Stackly!");
});
document.getElementById("google-login")?.addEventListener("click", function() {
  showToast("Google authentication coming soon.");
});
</script>

<script>
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const role = document.getElementById('login-role').value;
    const email = document.getElementById('login-email').value;
    
    // store email and role
    localStorage.setItem('userEmail', email);
    localStorage.setItem('userRole', role);
    
    if (role === 'admin') {
      window.location.href = 'admin_dashboard.html';
    } else {
      window.location.href = 'client_dashboard.html';
    }
  });
</script>
</body>

</html>
