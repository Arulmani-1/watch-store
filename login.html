<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Sign in to your Stackly account to manage orders, wishlist, and exclusive member benefits.">
  <title>Login — Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="cursor-dot" aria-hidden="true"></div><div class="cursor-outline" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<nav id="navbar" role="navigation" aria-label="Main navigation">
  <div class="nav-container">
    <a href="index.html" class="nav-logo">STACK<span>LY</span></a>
    <ul class="nav-links" role="list">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="services.html">Service</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <a href="login.html" class="nav-login" id="nav-login-btn">Login</a>
      <a href="signup.html" class="nav-signup" id="nav-signup-btn">Sign Up</a>
      <button id="hamburger-btn" class="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
    </div>
  </div>
</nav>
<div id="mobile-nav" role="dialog" aria-modal="true" aria-label="Mobile navigation">
  <nav class="mobile-nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="services.html">Service</a>
    <a href="blog.html">Blog</a>
    <a href="shop.html">Shop</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
  </nav>
</div>

<main class="auth-wrapper" id="main-content">
  <div class="auth-card" data-aos="scale-in">
    <div class="auth-logo">STACKLY</div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your collector account</p>

    <form id="login-form" aria-label="Login form" novalidate>
      <div class="form-group">
        <label for="login-email" class="form-label">Email</label>
        <input type="email" id="login-email" class="form-control" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password" class="form-label">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:1.5rem">
        <a href="#" style="font-size:0.8rem;color:var(--clr-gold)">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary w-full" id="login-submit">
        Sign In <i class="fa-regular fa-arrow-right"></i>
      </button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <button class="btn-ghost w-full" id="google-login" style="justify-content:center;gap:0.75rem">
      <i class="fa-brands fa-google"></i> Continue with Google
    </button>

    <p class="auth-footer-text">
      New to Stackly? <a href="signup.html">Create an account</a>
    </p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js" defer></script>
<script src="assets/js/main.js" defer></script>
<script>
document.getElementById("login-form")?.addEventListener("submit", function(e) {
  e.preventDefault();
  showToast("Welcome back to Stackly!");
});
document.getElementById("google-login")?.addEventListener("click", function() {
  showToast("Google authentication coming soon.");
});
</script>
</body>
</html>
